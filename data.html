<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Progress Dashboard - UPSSSC PET</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <div class="logo"><span class="badge">SNT</span><h1>Student Progress Dashboard</h1></div>
  <div><a href="index.html" class="btn btn-primary btn-sm">🏠 Back to Quiz</a></div>
</header>
<main class="container">
  <div class="welcome-banner" style="margin-bottom: 1.5rem;">
    <h2>Quiz Performance Records</h2>
    <p>Live student attempts, scores, and accuracy tracked via Firebase Firestore.</p>
  </div>
  
  <!-- Grid container where cards will be injected -->
  <div id="progressGridContainer" class="progress-grid">
    <div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--muted);">
      Loading student progress records...
    </div>
  </div>
</main>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAsSV2NvqEyXEk92xHNfi9MCPbQxPDvm8g",
    authDomain: "competitive-exams-by-kaushalji.firebaseapp.com",
    projectId: "competitive-exams-by-kaushalji",
    storageBucket: "competitive-exams-by-kaushalji.firebasestorage.app",
    messagingSenderId: "951680951005",
    appId: "1:951680951005:web:60903dd04be26eede37134",
    measurementId: "G-PS04MZCTNJ"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  async function loadProgressData() {
    const container = document.getElementById('progressGridContainer');
    try {
      const q = query(collection(db, "quiz_progress"), orderBy("timestamp", "desc"));
      const querySnapshot = await getDocs(q);
      
      if (querySnapshot.empty) {
        container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--muted);">No progress records found yet.</div>`;
        return;
      }

      container.innerHTML = '';
      querySnapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const dateStr = data.timestamp ? new Date(data.timestamp.seconds * 1000).toLocaleString() : 'Just now';
        
        const card = document.createElement('div');
        card.className = 'progress-card';
        card.innerHTML = `
          <div class="progress-header">
            <span class="progress-user">👤 ${data.email || data.uid}</span>
            <span class="progress-time">📅 ${dateStr}</span>
          </div>
          <div class="progress-body">
            <div class="progress-stat-box" style="grid-column: span 2; background: color-mix(in srgb, var(--primary) 8%, var(--card-bg)); border: 1px solid color-mix(in srgb, var(--primary) 20%, transparent);">
              <span>Final Score</span>
              <b style="color: var(--primary); font-size: 1.4rem;">${data.score} <small style="font-size: 0.9rem; color: var(--muted);">/ ${data.maxMarks}</small></b>
            </div>
            <div class="progress-stat-box">
              <span>Correct / Wrong</span>
              <b style="color: var(--success);">${data.correct} <small style="color: var(--danger);">/ ${data.wrong}</small></b>
            </div>
            <div class="progress-stat-box">
              <span>Accuracy</span>
              <b>${data.accuracy}%</b>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    } catch (err) {
      console.error("Error loading records:", err);
      container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--danger);">Error loading data from Firestore. Check console.</div>`;
    }
  }

  loadProgressData();
</script>
</body>
</html>
